services:
  - type: web
    name: fund-compliance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fund-compliance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fund-compliance-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-west-2

  # ---------------- Celery worker ----------------
  - type: worker
    name: fund-compliance-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "celery -A app.worker.celery_app worker --loglevel=info"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fund-compliance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fund-compliance-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          name: fund-compliance-api
          type: web
          envVarKey: JWT_SECRET_KEY
      - key: APP_ENV
        value: production
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-west-2

  # ---------------- Redis / Key Value (Celery broker) ----------------
  - type: keyvalue
    name: fund-compliance-redis
    plan: free
    ipAllowList: []

# ---------------- Managed Postgres ----------------
databases:
  - name: fund-compliance-db
    databaseName: fundcompliance
    user: funduser
    plan: free